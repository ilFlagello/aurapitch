# Archivio delle panchine (Wikidata) e studio sugli allenatori. Ogni mattina alle 5:30 UTC (prima del giro completo) per avere gli allenatori aggiornati.
name: Allenatori
on:
  workflow_dispatch:
    inputs:
      scarica: { description: "Riscarica l'archivio da Wikidata", default: "si" }
  schedule:
    - cron: "30 5 * * *"
permissions: { contents: write }
concurrency: { group: allenatori, cancel-in-progress: false }
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Stagione in corso da Football-Data (squadre e risultati)
        run: python3 -c "import raccoglitore; raccoglitore.scarica_stagione_fd()" || true
      - name: Archivio da Wikidata
        if: github.event_name == 'schedule' || inputs.scarica == 'si'
        run: python3 strumenti/allenatori.py
      - name: Studio e termometro della panchina
        run: |
          if [ -f strumenti/test_allenatori.py ]; then pip install -q numpy && python3 strumenti/test_allenatori.py; fi
      - name: Termometro nell'app (stagione in corso da Football-Data)
        run: |
          python3 genera_app.py --panchine
      - name: Salva
        run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add storico app/data 2>/dev/null; git commit -m "Allenatori: archivio e studio" || true
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
