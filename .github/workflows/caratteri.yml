# Una tantum: scarica i caratteri dell'app (Figtree e Big Shoulders Display, licenza OFL) in app/fonts/
name: Caratteri app
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          mkdir -p /tmp/f app/fonts && cd /tmp/f
          npm pack @fontsource-variable/figtree @fontsource/big-shoulders-display @fontsource-variable/big-shoulders-display || true
          for t in *.tgz; do mkdir -p "${t%.tgz}"; tar xzf "$t" -C "${t%.tgz}"; done
          ls */package/files | head -100
          cd "$GITHUB_WORKSPACE"
          cp /tmp/f/*figtree*/package/files/figtree-latin-wght-normal.woff2 app/fonts/figtree.woff2
          cp /tmp/f/*figtree*/package/files/figtree-latin-ext-wght-normal.woff2 app/fonts/figtree-ext.woff2 || true
          if ls /tmp/f/fontsource-variable-big-shoulders-display*/package/files/big-shoulders-display-latin-wght-normal.woff2 >/dev/null 2>&1; then
            cp /tmp/f/fontsource-variable-big-shoulders-display*/package/files/big-shoulders-display-latin-wght-normal.woff2 app/fonts/bigshoulders.woff2
          else
            cp /tmp/f/fontsource-big-shoulders-display*/package/files/big-shoulders-display-latin-800-normal.woff2 app/fonts/bigshoulders.woff2
          fi
          cp /tmp/f/*figtree*/package/LICENSE app/fonts/LICENSE-figtree.txt || true
          cp /tmp/f/fontsource-big-shoulders-display*/package/LICENSE app/fonts/LICENSE-bigshoulders.txt || true
          ls -la app/fonts
          git config user.name "aurapitch-caratteri"; git config user.email "aurapitch-caratteri@users.noreply.github.com"
          git add app/fonts && git commit -m "Caratteri dell'app (OFL)" && for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
