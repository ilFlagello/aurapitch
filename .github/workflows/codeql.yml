# Analisi di sicurezza del codice (CodeQL, gratuita per i repository pubblici): cerca vulnerabilità note nel codice
# dell'app, del servizio e degli script Python. I risultati compaiono in Security -> Code scanning.
name: Analisi sicurezza
on:
  push:
    branches: [main]
    paths: ["app/src/**", "app/*.js", "worker/**", "*.py", "strumenti/**"]
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
concurrency: { group: codeql, cancel-in-progress: true }
jobs:
  analizza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lingua: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.lingua }}
          queries: security-extended
          config: |
            paths-ignore: [app/dist, app/node_modules, app/data, data, storico]
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/lingua:${{ matrix.lingua }}"
