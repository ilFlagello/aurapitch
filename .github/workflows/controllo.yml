# AuraPitch - controllo di salute ogni ora: se qualcosa non va apre un avviso (issue "avviso") e GitHub manda una mail.
name: Controllo
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controllo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 strumenti/controllo.py
