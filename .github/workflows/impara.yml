# AuraPitch - apprendimento iterativo: ogni mattina alle 5:45 UTC (prima del giro completo delle 6:00) l'algoritmo
# si riallena su archivio storico + diario delle previsioni dell'app e aggiorna data/modello.json e la pagina "Come sta andando l'IA".
name: Apprendimento
on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 5 * * *"
permissions: { contents: write }
concurrency: { group: impara, cancel-in-progress: false }
jobs:
  impara:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Stagione in corso da Football-Data (risultati e quote)
        run: python3 -c "import raccoglitore; raccoglitore.scarica_stagione_fd()" || true
      - name: Apri la cassaforte (tutto il diario)
        env: { GH_DISPATCH_TOKEN: "${{ secrets.GH_DISPATCH_TOKEN }}" }
        run: python3 strumenti/cassaforte.py apri --tutto
      - name: Impara dai risultati
        run: |
          pip install -q numpy
          python3 strumenti/impara.py
      - name: Chiudi la cassaforte (modello nuovo)
        env: { GH_DISPATCH_TOKEN: "${{ secrets.GH_DISPATCH_TOKEN }}" }
        run: python3 strumenti/cassaforte.py chiudi
      - name: Salva
        run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add data/modello.json app/data/ia.json; git commit -m "Apprendimento: modello del $(date -u +%F)" || true
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 7; done
