# Archivio meteo per il test dell'algoritmo (a mano: Actions -> Archivio meteo -> Run workflow)
name: Archivio meteo
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python strumenti/scarica_meteo.py 2>&1 | tee storico/meteo_esito.txt
      - run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add storico && git commit -m "Archivio meteo per i test" && for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
