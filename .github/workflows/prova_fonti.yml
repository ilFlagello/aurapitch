# Prova delle fonti gratuite di quote e calendari (manuale). Salva storico/prova_fonti.json
name: Prova fonti
on:
  workflow_dispatch:
    inputs:
      lista: { description: "Codici ESPN separati da virgola (vuoto = elenco standard)", default: "" }
      giorni: { description: "Giorni da guardare", default: "8" }
permissions: { contents: write }
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 strumenti/prova_fonti.py || true
        env:
          LISTA: ${{ inputs.lista }}
          GIORNI: ${{ inputs.giorni }}
      - run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add storico/prova_fonti.json && git commit -m "Prova fonti" && git pull --rebase && git push || true
