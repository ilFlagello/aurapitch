# Prova del Blocco 5 (solo su questo ramo, nessun salvataggio): identita unica con dati veri, prima e dopo
name: Prova identita
on: { push: { branches: [prova-identita] } }
permissions: { contents: read }
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Raccolta ESPN nuova (senza voti e arbitri)
        run: python3 -u -c "import time, espn_dati as ES; ES.giro_voti=lambda *a, **k: None; ES.giro_arbitri=lambda *a, **k: None; t=time.time(); ES.giro_espn(); print('durata del giro ESPN', round(time.time()-t), 'secondi')"
      - name: Risultati del campionato uguali a prima?
        run: python3 -u strumenti/prova_identita.py
      - name: Genera con main e con il ramo, stessi dati
        run: |
          git fetch --depth 1 origin main
          git worktree add ../vecchio origin/main
          cp data/espn/squadre.json ../vecchio/data/espn/squadre.json
          (cd ../vecchio && python3 -u $GITHUB_WORKSPACE/strumenti/identita.py --salva /tmp/prima.json | tail -3)
          python3 -u strumenti/identita.py --salva /tmp/dopo.json | tail -4
          python3 -u strumenti/identita.py /tmp/prima.json /tmp/dopo.json || true
      - name: Dati ESPN per l'analisi in locale (registro, compressi)
        run: |
          echo "INIZIO_SQUADRE"; gzip -9c data/espn/squadre.json | base64 -w 0; echo; echo "FINE_SQUADRE"
