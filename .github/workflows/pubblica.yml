# AuraPitch - pubblica la web app su GitHub Pages a ogni modifica della cartella app/
# Prima volta: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: Pubblica app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pubblica.yml"]
  workflow_run:                 # dopo ogni raccolta dati (i suoi salvataggi non fanno partire il push)
    workflows: ["Raccolta dati AuraPitch", "Notifiche AuraPitch"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installa le librerie
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compila l'app
        working-directory: app
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
