# AuraPitch - pubblica la web app su GitHub Pages a ogni modifica della cartella app/
# Prima volta: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: Pubblica app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pubblica.yml"]
  workflow_run:                 # dopo ogni raccolta dati (i suoi salvataggi non fanno partire il push)
    workflows: ["Raccolta dati AuraPitch", "Notifiche AuraPitch"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Installa le librerie
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compila l'app
        working-directory: app
        run: node build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
