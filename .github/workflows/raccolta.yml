# AuraPitch - raccolta dati automatica (GitHub Actions)
# Chiavi in: Settings -> Secrets and variables -> Actions
#   ODDS_API_KEY (quote), FOOTBALL_DATA_KEY (risultati e classifiche), API_FOOTBALL_KEY (facoltativa: formazioni e infortuni)
# Orari in UTC (ora italiana = UTC+1 d'inverno, UTC+2 d'estate).

name: Raccolta dati AuraPitch

on:
  schedule:
    - cron: "0 6 * * *"          # giro completo ogni mattina
    - cron: "*/10 10-23 * * *"   # risultati e stato partite ogni 10 minuti (la diretta vera la legge il telefono ogni 30 secondi) (e formazioni, se disponibili)
  workflow_dispatch: {}          # pulsante "Run workflow" per lanciarlo a mano (giro completo)

permissions:
  contents: write                # serve per salvare i dati raccolti nell'archivio

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Giro completo (quote, risultati, classifiche) e dati dell'app
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
        run: |
          python raccoglitore.py
          python genera_app.py

      - name: Aggiornamento durante il giorno (risultati e formazioni)
        if: github.event.schedule == '*/10 10-23 * * *'
        run: |
          python raccoglitore.py --formazioni
          python raccoglitore.py --aggiorna
          python genera_app.py --live

      - name: Salva i dati nell'archivio
        run: |
          git config user.name "aurapitch-raccolta"
          git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add data app/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "Dati $(date -u +%Y-%m-%d_%H%M)"
            git push
          fi
