# AuraPitch - raccolta dati automatica (GitHub Actions)
# Chiavi in: Settings -> Secrets and variables -> Actions
#   ODDS_API_KEY (quote), FOOTBALL_DATA_KEY (risultati e classifiche), API_FOOTBALL_KEY (facoltativa: formazioni e infortuni)
# Orari in UTC (ora italiana = UTC+1 d'inverno, UTC+2 d'estate).

name: Raccolta dati AuraPitch

# Avvio: l'orologio del servizio Cloudflare (worker/index.js) chiama questo workflow alle 6:00 UTC (completo)
# e ogni 10 minuti dalle 10 alle 23:50 UTC (live). Gli avvii programmati di GitHub non partivano.
on:
  workflow_dispatch:             # anche a mano: Actions -> Raccolta dati AuraPitch -> Run workflow
    inputs:
      modo:
        description: "completo (mattino), live (aggiornamento) oppure archivio (solo voti e dati della diretta delle partite passate, senza quote)"
        default: completo
        type: choice
        options: [completo, live, archivio]

permissions:
  contents: write                # serve per salvare i dati raccolti nell'archivio

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'ultima versione dei dati (non quella del momento in cui il giro e stato messo in coda)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archivio voti e diretta (nessun credito delle quote)
        if: inputs.modo == 'archivio'
        run: python -c "import espn_dati; espn_dati.giro_voti(massimo=1200)"

      - name: Giro completo (quote, risultati, classifiche) e dati dell'app
        if: inputs.modo == 'completo'
        run: |
          python raccoglitore.py
          python raccoglitore.py --notizie --forza
          python raccoglitore.py --espn
          python genera_app.py

      - name: Aggiornamento durante il giorno (risultati e formazioni)
        if: inputs.modo == 'live'
        run: |
          python raccoglitore.py --formazioni
          python raccoglitore.py --aggiorna
          python raccoglitore.py --prepartita
          python raccoglitore.py --notizie
          python raccoglitore.py --arbitri
          python genera_app.py --live

      - name: Salva i dati nell'archivio
        run: |
          git config user.name "aurapitch-raccolta"
          git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add data app/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "Dati $(date -u +%Y-%m-%d_%H%M)"
            for i in 1 2 3 4; do git pull --rebase -X theirs -q origin main && git push && break; sleep 5; done
          fi
