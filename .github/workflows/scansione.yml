# AuraPitch - cerca ogni mese (e a richiesta) le competizioni con quote gratuite non ancora nell'app. Salva storico/scansione_leghe.json
name: Scansione campionati
on:
  workflow_dispatch:
    inputs:
      giorni: { description: "Giorni da guardare", default: "10" }
  schedule:
    - cron: "0 4 2 * *"
permissions: { contents: write }
jobs:
  scansione:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python3 strumenti/scansiona_leghe.py
        env: { GIORNI: "${{ inputs.giorni || '10' }}" }
      - run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add storico/scansione_leghe.json && git commit -m "Scansione campionati" && for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done || true
