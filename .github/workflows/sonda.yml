# Prova temporanea delle fonti (si cancella dopo)
name: Sonda fonti live
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova
        run: |
          mkdir -p sonda4; cd sonda4
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          curl -s "$S/ita.1/teams" -o teams1.json
          for T in $(python3 -c "import json;d=json.load(open('teams1.json'));print(' '.join(t['team']['id'] for t in d['sports'][0]['leagues'][0]['teams'][:20]))"); do curl -s "$S/ita.1/teams/$T/roster" -o r1_$T.json; done
          curl -s "$S/ita.2/teams" -o teams2.json
          T2=$(python3 -c "import json;d=json.load(open('teams2.json'));print(d['sports'][0]['leagues'][0]['teams'][0]['team']['id'])"); curl -s "$S/ita.2/teams/$T2/roster" -o r2.json
          curl -s "https://site.api.espn.com/apis/v2/sports/soccer/ita.2/standings" -o st2.json
          curl -s "$S/ita.2/scoreboard?dates=20260801-20261027&limit=400" -o sb2_season.json
          ls -la | head; du -sh .
      - name: Salva
        run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add sonda4 && git commit -m "Sonda 4" && git pull --rebase && git push
