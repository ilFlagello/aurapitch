# Prova temporanea delle fonti live gratuite (si cancella dopo)
name: Sonda fonti live
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova ESPN 2
        run: |
          mkdir -p sonda2
          curl -s "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ita.1/seasons/2024/types/1/athletes/181836/statistics/1?lang=en&region=us" -o sonda2/core_stats.json
          curl -s "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ita.1/seasons/2024/teams/112?lang=en&region=us" -o sonda2/core_team.json
          curl -s -D sonda2/core_h.txt "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ita.1/seasons/2024/types/1/athletes/181836/statistics/1?lang=en&region=us" -o /dev/null
          curl -s "https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/181836/stats?season=2024&league=ita.1" -o sonda2/stats_2024.json
          curl -s "https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/362137/overview" -o sonda2/ov_field.json
          ls -la sonda2
      - name: Salva
        run: |
          git config user.name "aurapitch-raccolta"; git config user.email "aurapitch-raccolta@users.noreply.github.com"
          git add sonda2 && git commit -m "Sonda 2" && git push
