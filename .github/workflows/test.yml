# AuraPitch - test automatici a ogni modifica del codice (e ogni mattina sui dati del giorno).
# Se qualcosa si rompe, GitHub manda una mail al proprietario del repository; le schermate della prova restano tra gli "artifacts".
name: Test

on:
  push:
    branches: [main]
    paths: ["app/src/**", "app/build.mjs", "app/sw.js", "app/index.html", "*.py", "strumenti/**", "test/**", "worker/**", ".github/workflows/test.yml"]
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Librerie
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Nessun segreto nel repository
        run: python3 strumenti/cerca_segreti.py
      - name: Algoritmo (mercati, cartellini, apprendimento, dati pubblicati)
        run: |
          pip install -q numpy
          python3 -m unittest discover -s test -v
      - name: Logica dell'app (stessi esiti dell'algoritmo, schedina)
        run: node test/test_app.mjs
      - name: Servizio (sintassi) e account (passkey, Google, esporta, elimina)
        run: |
          node --check worker/index.js
          node --check worker/accesso.js
          node test/test_accesso.mjs
      - name: Compila l'app
        working-directory: app
        run: node build.mjs
      - name: Interfaccia (tutte le schermate, tema chiaro e scuro)
        run: node test/test_interfaccia.mjs
      - name: Schermate della prova
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schermate
          path: test/schermate
          retention-days: 7
