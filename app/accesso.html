<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.workers.dev; img-src 'self'; base-uri 'none'; form-action 'none'">

<title>AuraPitch - Accesso</title>
<style>
:root { --bg: #EFEEF5; --fg: #17152B; --mu: #5F5B76; --acc: #5B2EE6; }
@media (prefers-color-scheme: dark) { :root { --bg: #0E0C18; --fg: #F4F2FF; --mu: #9A95B3; --acc: #A58BFF; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
main { max-width: 360px; padding: 32px 24px; text-align: center; }
img { width: 64px; height: 64px; border-radius: 16px; }
h1 { font-size: 22px; margin: 18px 0 8px; }
p { color: var(--mu); font-size: 15px; line-height: 1.45; margin: 0 0 18px; }
a { display: inline-block; background: var(--acc); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 14px; }
@media (prefers-color-scheme: dark) { a { color: #0E0C18; } }
</style>
